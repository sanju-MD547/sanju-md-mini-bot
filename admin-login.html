<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANJU MD • Admin Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  display:grid;
  place-items:center
}

body:before{
  content:"";
  position:fixed;
  inset:-30%;
  background:radial-gradient(circle at 50% 35%,#c59b3b22,transparent 34%);
  pointer-events:none
}

.box{
  width:min(92%,410px);
  padding:30px 24px;
  border:1px solid #b58a2744;
  border-radius:25px;
  background:#0b0b0bee;
  box-shadow:0 20px 70px #000
}

.logo{
  width:105px;
  height:105px;
  border:2px solid #d6ae48;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 20px;
  background:radial-gradient(circle,#2a210c,#080808 68%);
  color:#f0cb64;
  font-size:27px;
  font-weight:900;
  text-align:center
}

h1{
  text-align:center;
  margin:0;
  color:#edca66;
  letter-spacing:2px
}

.sub{
  text-align:center;
  color:#888;
  font-size:13px;
  margin:8px 0 25px
}

label{
  display:block;
  color:#cdb36c;
  font-size:12px;
  margin:14px 0 7px
}

input{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:1px solid #5b481f;
  background:#111;
  color:#fff;
  outline:none;
  font-size:14px
}

input:focus{
  border-color:#d0a83f
}

.login{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:25px;
  background:linear-gradient(135deg,#f2d06b,#a87617);
  font-weight:900;
  color:#090909;
  cursor:pointer
}

.msg{
  margin-top:16px;
  padding:10px 14px;
  border-radius:12px;
  font-size:12.5px;
  text-align:center;
  display:none
}

.msg.err{
  display:block;
  background:#3a121266;
  border:1px solid #c0473a66;
  color:#ffb3a8
}

.msg.ok{
  display:block;
  background:#123a1a66;
  border:1px solid #4ac07366;
  color:#a8ffbf
}

.forgot{
  text-align:right;
  margin-top:8px
}

.forgot a{
  color:#a68a4c;
  font-size:11.5px;
  text-decoration:none
}
</style>
</head>

<body>

<main class="box">

<div class="logo">
S<br><small>MD</small>
</div>

<h1>ADMIN LOGIN</h1>

<p class="sub">
SANJU MD Mini Bot • Control Center
</p>

<form id="login-form">

<label>EMAIL</label>

<input
id="email"
type="email"
autocomplete="username"
required
placeholder="Enter email"
>

<label>PASSWORD</label>

<input
id="password"
type="password"
autocomplete="current-password"
required
placeholder="Enter password"
>

<p class="forgot">
<a href="#" id="forgot-link">Forgot password?</a>
</p>

<button
class="login"
type="submit"
id="login-btn">
🔐 LOGIN TO DASHBOARD
</button>

</form>

<div class="msg" id="msg"></div>

</main>

<script src="https://unpkg.com/netlify-identity-widget@1/build/netlify-identity-widget.js"></script>

<script>

const form = document.getElementById("login-form")
const msg = document.getElementById("msg")
const btn = document.getElementById("login-btn")

function showMessage(text,type){

  msg.textContent = text
  msg.className = "msg " + type

}

form.addEventListener("submit", async function(e){

  e.preventDefault()

  const email =
    document.getElementById("email").value.trim()

  const password =
    document.getElementById("password").value

  if(!email || !password) return

  btn.disabled = true

  showMessage("Signing in…","ok")

  try{

    const user =
      await netlifyIdentity.login(
        email,
        password
      )

    const roles =
      user.app_metadata?.roles ||
      user.roles ||
      []

    if(roles.includes("admin")){

      showMessage(
        "Login successful. Redirecting…",
        "ok"
      )

      setTimeout(function(){

        window.location.href="/admin.html"

      },500)

    }else{

      await netlifyIdentity.logout()

      showMessage(
        "This account does not have admin access.",
        "err"
      )

    }

  }catch(error){

    showMessage(
      error.message || "Login failed.",
      "err"
    )

  }finally{

    btn.disabled = false

  }

})

document
.getElementById("forgot-link")
.addEventListener("click",function(e){

  e.preventDefault()

  const email =
    document.getElementById("email").value.trim()

  if(!email){

    showMessage(
      "Enter your email first.",
      "err"
    )

    return

  }

  netlifyIdentity.open("forgot-password")

})

netlifyIdentity.on("login",function(user){

  const roles =
    user.app_metadata?.roles ||
    user.roles ||
    []

  if(roles.includes("admin")){

    window.location.href="/admin.html"

  }

})

netlifyIdentity.init()

</script>

</body>
  </html>
